<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#142a31">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="辅导员工作台">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>辅导员工作台</title>
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input id="xlsx-input" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
  <input id="photozip-input" type="file" accept=".zip,application/zip" hidden>
  <input id="package-input" type="file" accept=".zip,application/zip" hidden>
  <script src="vendor/qrcode.js"></script>
  <script type="module" src="app.js"></script>

</html>
